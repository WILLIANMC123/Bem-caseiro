<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Meus Pedidos</title>
    <style>
        .detalhes-linha td { background:#F8F4EB; font-size:0.95rem; }
        .btn-detalhes { background:linear-gradient(135deg,var(--azul-bebe),var(--azul-escuro)) !important; padding:8px 14px !important; font-size:0.9rem !important; box-shadow:none !important; }
        .lista-itens { margin:0; padding-left:18px; }
    </style>
</head>
<body>
    <nav class="bc-nav"></nav>
    <header class="banner">
        <img src="logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Meus Pedidos</h1>
        <p>Seus pedidos e reservas</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>Histórico</h2>
            <table>
                <thead>
                    <tr><th>Data</th><th>Responsável</th><th>Valor</th><th>Tempo</th><th></th></tr>
                </thead>
                <tbody id="lista">
                    <tr><td colspan="5" style="text-align:center;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <footer class="rodape"><p>&copy; 2026 Bem Caseiro - Pães e Delícias</p></footer>
    <script src="auth.js"></script>
    <script>
        const s = bcRequireLogin();
        if (!s) throw new Error('redirect');
        if (s.tipo === 'admin') {
            window.location.href = 'consulta_agendamentos.html';
            throw new Error('redirect');
        }
        bcRenderChrome('meus');

        function formatarPreco(v) {
            return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function formatarData(d) {
            if (!d) return '-';
            const p = d.split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
        }

        (async () => {
            const res = await fetch('/meus-agendamentos', { headers: bcAuthHeaders() });
            if (res.status === 401) return bcLogout();
            const lista = await res.json() || [];
            const corpo = document.getElementById('lista');
            if (!lista.length) {
                corpo.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--texto-claro);">Você ainda não tem pedidos. <a href="agendamentos.html">Fazer pedido</a></td></tr>';
                return;
            }
            corpo.innerHTML = lista.map(a => `
                <tr>
                    <td>${bcEscape(formatarData(a.data))}</td>
                    <td>${bcEscape(a.responsavel)}</td>
                    <td>R$ ${formatarPreco(a.total)}</td>
                    <td>${a.tempo_total || 0} min</td>
                    <td><button type="button" class="btn-detalhes" data-id="${a.id}">Detalhes</button></td>
                </tr>
                <tr class="detalhes-linha" id="detalhe-${a.id}" style="display:none;"><td colspan="5"></td></tr>
            `).join('');

            corpo.querySelectorAll('.btn-detalhes').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const linha = document.getElementById('detalhe-' + id);
                    if (linha.style.display === 'table-row') {
                        linha.style.display = 'none';
                        btn.textContent = 'Detalhes';
                        return;
                    }
                    linha.style.display = 'table-row';
                    btn.textContent = 'Ocultar';
                    const r = await fetch('/detalhes-agendamento/' + id, { headers: bcAuthHeaders() });
                    const itens = await r.json();
                    linha.querySelector('td').innerHTML = !itens.length ? '<em>Sem itens</em>' :
                        `<ul class="lista-itens">${itens.map(i => `<li>${bcEscape(i.descricao)} — R$ ${formatarPreco(i.preco_cobrado)}</li>`).join('')}</ul>`;
                });
            });
        })();
    </script>
</body>
</html>
