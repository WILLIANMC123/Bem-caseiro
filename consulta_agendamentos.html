<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Consultar Pedidos</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta</a>
    </nav>

    <header class="banner">
        <img src="imagens/logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Consulta de Pedidos</h1>
        <p>Histórico de agendamentos e entregas</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Pedidos Realizados</h2>
            <input type="text" id="busca" placeholder="Buscar por cliente ou data..." 
                   style="margin-bottom: 15px;" onkeyup="filtrarTabela()">
            
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Cliente</th>
                        <th>Serviços</th>
                        <th>Valor Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="lista-agendamentos"></tbody>
            </table>
        </div>
    </div>

    <footer class="rodape">
        <p>&copy; 2026 Bem Caseiro - Pães e Delícias</p>
    </footer>

    <script>
        fetch('/listar-agendamentos')
            .then(res => res.json())
            .then(agendamentos => {
                const corpo = document.getElementById('lista-agendamentos');
                agendamentos.forEach(a => {
                    corpo.innerHTML += `
                        <tr>
                            <td>${a.data}</td>
                            <td><strong>${a.cliente}</strong></td>
                            <td>${a.servicos}</td>
                            <td>R$ ${a.total ? a.total.toFixed(2) : '0.00'}</td>
                            <td><span style="color: green; font-weight: bold;">${a.status || 'Concluído'}</span></td>
                        </tr>`;
                });
            });

        function filtrarTabela() {
            // Função básica de filtro (pode ser melhorada)
            console.log("Filtrando...");
        }
    </script>
</body>
</html>
