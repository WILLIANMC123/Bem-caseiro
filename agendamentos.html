<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Agendamentos</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta</a>
    </nav>

    <header class="banner">
        <img src="logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Novo Agendamento / Pedido</h1>
        <p>Registre pedidos e entregas</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Dados do Pedido</h2>
            <form id="form-agendamento">
                <label for="cliente_id">Cliente:</label>
                <select id="cliente_id" name="cliente_id" required>
                    <option value="">Carregando clientes...</option>
                </select>

                <label for="data_entrega">Data de Entrega:</label>
                <input type="date" id="data_entrega" name="data_entrega" required>

                <label for="responsavel">Responsável:</label>
                <input type="text" id="responsavel" name="responsavel" placeholder="Nome de quem está atendendo" required>

                <h3>Serviços do Pedido</h3>
                <div id="carrinho" style="border: 2px dashed var(--rosa-bebe); padding: 15px; border-radius: 12px; min-height: 120px; margin-bottom: 15px; background: #fff;">
                    <!-- Serviços adicionados aparecerão aqui -->
                </div>

                <button type="button" onclick="adicionarServico()" style="background: var(--azul-bebe);">+ Adicionar Serviço</button>
                <button type="submit" style="margin-top: 15px; width: auto; padding: 14px 30px;">Finalizar Pedido</button>
            </form>
        </div>
    </div>

    <footer class="rodape">
        <p>&copy; 2026 Bem Caseiro - Pães e Delícias</p>
    </footer>

    <script>
        // ===================== CARREGAR CLIENTES =====================
        async function carregarClientes() {
            try {
                const response = await fetch('/listar-clientes');
                const clientes = await response.json();
                
                const select = document.getElementById('cliente_id');
                select.innerHTML = '<option value="">Selecione um cliente...</option>';
                
                clientes.forEach(cliente => {
                    const option = document.createElement('option');
                    option.value = cliente.id;
                    option.textContent = `${cliente.nome} (${cliente.telefone})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Erro ao carregar clientes:', error);
                document.getElementById('cliente_id').innerHTML = '<option value="">Erro ao carregar clientes</option>';
            }
        }

        // ===================== FUNÇÃO PARA ADICIONAR SERVIÇO (básica) =====================
        function adicionarServico() {
            alert("🔧 Função de adicionar serviços em desenvolvimento.\n\nEm breve você poderá escolher serviços salvos.");
            // Futuramente aqui vai abrir um modal com serviços
        }

        // ===================== ENVIAR FORMULÁRIO =====================
        document.getElementById('form-agendamento').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("✅ Pedido finalizado com sucesso! (Integração completa em breve)");
            // Aqui virá a lógica completa de envio para /finalizar-agendamento
        });

        // Carrega os clientes assim que a página abrir
        window.onload = carregarClientes;
    </script>
</body>
</html>
