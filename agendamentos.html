<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Pedidos</title>
    <style>
        .item-carrinho { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid #eee; gap:10px; flex-wrap:wrap; }
        .item-carrinho:last-child { border-bottom:none; }
        .resumo-pedido { margin-top:16px; padding:14px; background:#F8F4EB; border-radius:12px; font-weight:600; }
        .btn-remover { background:#e74c3c !important; padding:8px 14px !important; font-size:0.9rem !important; box-shadow:none !important; }
    </style>
</head>
<body>
    <nav class="bc-nav"></nav>
    <header class="banner">
        <img src="logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Novo Pedido / Reserva</h1>
        <p>Escolha produtos e finalize</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>Dados do Pedido</h2>
            <form id="form-agendamento">
                <div id="wrap-cliente">
                    <label for="cliente_id">Cliente:</label>
                    <select id="cliente_id" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
                <p id="info-cliente" style="display:none; color:var(--texto-claro);"></p>

                <label for="data_entrega">Data de Entrega:</label>
                <input type="date" id="data_entrega" required>

                <label for="responsavel">Responsável / Observação:</label>
                <input type="text" id="responsavel" required maxlength="80" placeholder="Seu nome ou quem retira">

                <h3>Produtos do Pedido</h3>
                <label for="select-servico">Escolha um produto:</label>
                <select id="select-servico"><option value="">Carregando...</option></select>
                <button type="button" id="btn-add" style="background:linear-gradient(135deg,var(--azul-bebe),var(--azul-escuro)); margin-bottom:12px;">+ Adicionar</button>

                <div id="carrinho" style="border:2px dashed var(--rosa-bebe); padding:15px; border-radius:12px; min-height:80px; background:#fff;">
                    <p id="carrinho-vazio" style="color:var(--texto-claro); margin:0; text-align:center;">Nenhum item ainda.</p>
                    <div id="lista-carrinho"></div>
                </div>
                <div class="resumo-pedido" id="resumo">Total: R$ 0,00 | Tempo: 0 min</div>
                <div id="feedback" class="msg-feedback"></div>
                <button type="submit" id="btn-finalizar" style="width:100%; margin-top:15px;">Finalizar Pedido</button>
            </form>
        </div>
    </div>
    <footer class="rodape"><p>&copy; 2026 Bem Caseiro - Pães e Delícias</p></footer>
    <script src="auth.js"></script>
    <script>
        const sess = bcRequireLogin();
        if (!sess) throw new Error('redirect');
        bcRenderChrome('agendamentos');

        let servicos = [];
        let carrinho = [];

        function formatarPreco(v) {
            return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function atualizarResumo() {
            const total = carrinho.reduce((s, i) => s + Number(i.preco), 0);
            const tempo = carrinho.reduce((s, i) => s + Number(i.tempo_estimado), 0);
            document.getElementById('resumo').innerHTML =
                `Total: <strong>R$ ${formatarPreco(total)}</strong> | Tempo: <strong>${tempo} min</strong>`;
        }

        function renderCarrinho() {
            const lista = document.getElementById('lista-carrinho');
            const vazio = document.getElementById('carrinho-vazio');
            if (!carrinho.length) {
                vazio.style.display = 'block';
                lista.innerHTML = '';
            } else {
                vazio.style.display = 'none';
                lista.innerHTML = carrinho.map((item, idx) => `
                    <div class="item-carrinho">
                        <div><strong>${bcEscape(item.descricao)}</strong><br>
                        <small>R$ ${formatarPreco(item.preco)} · ${item.tempo_estimado} min</small></div>
                        <button type="button" class="btn-remover" data-idx="${idx}">Remover</button>
                    </div>
                `).join('');
                lista.querySelectorAll('.btn-remover').forEach(btn => {
                    btn.addEventListener('click', () => {
                        carrinho.splice(Number(btn.dataset.idx), 1);
                        renderCarrinho();
                    });
                });
            }
            atualizarResumo();
        }

        async function carregarServicos() {
            const res = await fetch('/listar-servicos', { headers: bcAuthHeaders() });
            if (res.status === 401) return bcLogout();
            servicos = await res.json();
            const sel = document.getElementById('select-servico');
            sel.innerHTML = '<option value="">Selecione...</option>';
            servicos.forEach(s => {
                const o = document.createElement('option');
                o.value = s.id;
                o.textContent = `${s.descricao} — R$ ${formatarPreco(s.preco)}`;
                sel.appendChild(o);
            });
        }

        async function carregarClientesAdmin() {
            const res = await fetch('/listar-clientes', { headers: bcAuthHeaders() });
            if (res.status === 401) return bcLogout();
            const clientes = await res.json();
            const sel = document.getElementById('cliente_id');
            sel.innerHTML = '<option value="">Selecione o cliente...</option>';
            clientes.forEach(c => {
                const o = document.createElement('option');
                o.value = c.id;
                o.textContent = `${c.nome} (${c.telefone || c.cpf})`;
                sel.appendChild(o);
            });
        }

        if (bcIsCliente()) {
            document.getElementById('wrap-cliente').style.display = 'none';
            document.getElementById('cliente_id').required = false;
            document.getElementById('info-cliente').style.display = 'block';
            document.getElementById('info-cliente').textContent =
                'Pedido em nome de: ' + (sess.usuario && sess.usuario.nome);
            document.getElementById('responsavel').value = (sess.usuario && sess.usuario.nome) || '';
        } else {
            carregarClientesAdmin();
        }

        document.getElementById('btn-add').addEventListener('click', () => {
            const id = document.getElementById('select-servico').value;
            if (!id) return alert('Selecione um produto.');
            const s = servicos.find(x => String(x.id) === String(id));
            if (!s) return;
            carrinho.push({ id: s.id, descricao: s.descricao, preco: s.preco, tempo_estimado: s.tempo_estimado });
            renderCarrinho();
            document.getElementById('select-servico').value = '';
        });

        document.getElementById('form-agendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fb = document.getElementById('feedback');
            const btn = document.getElementById('btn-finalizar');
            const data = document.getElementById('data_entrega').value;
            const responsavel = document.getElementById('responsavel').value.trim();
            let cliente_id = document.getElementById('cliente_id').value;

            if (bcIsCliente()) cliente_id = sess.usuario.id;
            if (!data || !responsavel) {
                fb.className = 'msg-feedback msg-erro';
                fb.style.display = 'block';
                fb.textContent = 'Preencha data e responsável.';
                return;
            }
            if (!cliente_id) {
                fb.className = 'msg-feedback msg-erro';
                fb.style.display = 'block';
                fb.textContent = 'Selecione o cliente.';
                return;
            }
            if (!carrinho.length) {
                fb.className = 'msg-feedback msg-erro';
                fb.style.display = 'block';
                fb.textContent = 'Adicione pelo menos um produto.';
                return;
            }

            const total = carrinho.reduce((s, i) => s + Number(i.preco), 0);
            const tempo_total = carrinho.reduce((s, i) => s + Number(i.tempo_estimado), 0);
            btn.disabled = true;
            btn.textContent = 'Salvando...';

            try {
                const res = await fetch('/finalizar-agendamento', {
                    method: 'POST',
                    headers: { ...bcAuthHeaders(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cliente_id: Number(cliente_id),
                        data,
                        responsavel,
                        total,
                        tempo_total,
                        servicos: carrinho.map(i => ({ id: i.id, preco: i.preco }))
                    })
                });
                const dataRes = await res.json();
                if (!dataRes.success) throw new Error(dataRes.error || 'Erro');
                fb.className = 'msg-feedback msg-sucesso';
                fb.style.display = 'block';
                fb.textContent = 'Pedido realizado com sucesso!';
                setTimeout(() => {
                    window.location.href = bcIsAdmin() ? 'consulta_agendamentos.html' : 'meus_pedidos.html';
                }, 1000);
            } catch (err) {
                fb.className = 'msg-feedback msg-erro';
                fb.style.display = 'block';
                fb.textContent = err.message;
                btn.disabled = false;
                btn.textContent = 'Finalizar Pedido';
            }
        });

        document.getElementById('data_entrega').min = new Date().toISOString().split('T')[0];
        carregarServicos();
        renderCarrinho();
    </script>
</body>
</html>
