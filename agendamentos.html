<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Agendamentos</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta</a>
    </nav>

    <header class="banner">
        <img src="imagens/logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Novo Agendamento / Pedido</h1>
        <p>Registre pedidos e entregas</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Dados do Pedido</h2>
            <form action="/finalizar-agendamento" method="POST">
                <label for="cliente_id">Cliente:</label>
                <select id="cliente_id" name="cliente_id" required>
                    <!-- Populado via JavaScript -->
                </select>

                <label for="data_entrega">Data de Entrega:</label>
                <input type="date" id="data_entrega" name="data_entrega" required>

                <label for="observacoes">Observações:</label>
                <textarea id="observacoes" name="observacoes" rows="3" placeholder="Ex: Entregar quente, sem glúten..."></textarea>

                <h3>Serviços do Pedido</h3>
                <div id="carrinho" style="border: 2px dashed #E67A7A; padding: 15px; border-radius: 8px; min-height: 100px; margin-bottom: 15px;">
                    <!-- Itens adicionados aparecem aqui -->
                </div>

                <button type="button" onclick="adicionarServico()">Adicionar Serviço</button>
                <button type="submit" style="margin-top: 15px;">Finalizar Pedido</button>
            </form>
        </div>
    </div>

    <footer class="rodape">
        <p>&copy; 2026 Bem Caseiro - Pães e Delícias</p>
    </footer>

    <script>
        // Exemplo simples - você pode expandir depois
        function adicionarServico() {
            alert("🔧 Função de adicionar serviço em desenvolvimento.\n\nNo backend será integrado com /listar-servicos");
        }
    </script>
</body>
</html>
