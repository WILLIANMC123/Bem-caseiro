<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Produtos</title>
</head>
<body>
    <nav class="bc-nav"></nav>
    <header class="banner">
        <img src="logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Produtos e Serviços</h1>
        <p id="subtitulo">Catálogo</p>
    </header>
    <div class="container">
        <div class="card" id="card-form" style="display:none;">
            <h2>Novo Produto / Serviço</h2>
            <form id="form-servico">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" name="descricao" required maxlength="150" placeholder="Ex: Pão Francês (dúzia)">
                <label for="preco">Preço (R$):</label>
                <input type="number" step="0.01" min="0" id="preco" name="preco" required placeholder="0.00">
                <label for="tempo_estimado">Quando foi feito?</label>
                <select id="tempo_estimado" name="tempo_estimado" required>
                    <option value="0">Feito hoje</option>
                    <option value="1">Feito ontem</option>
                    <option value="2">Feito há 2 dias</option>
                    <option value="3">Feito há 3 dias</option>
                    <option value="4">Feito há 4 dias</option>
                    <option value="5">Feito há 5 dias</option>
                    <option value="7">Feito há cerca de 1 semana</option>
                </select>
                <button type="submit">Salvar</button>
            </form>
        </div>
        <div class="card">
            <h2>Disponíveis</h2>
            <table>
                <thead><tr><th>Descrição</th><th>Preço</th><th>Quando foi feito</th></tr></thead>
                <tbody id="lista-servicos"><tr><td colspan="3" style="text-align:center;">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>
    <footer class="rodape"><p>&copy; 2026 Bem Caseiro - Pães e Delícias</p></footer>
    <script src="auth.js"></script>
    <script>
        const s = bcRequireLogin();
        if (!s) throw new Error('redirect');
        bcRenderChrome('servicos');

        if (bcIsAdmin()) {
            document.getElementById('card-form').style.display = 'block';
            document.getElementById('subtitulo').textContent = 'Cadastre e visualize produtos (admin)';
            document.getElementById('form-servico').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const res = await fetch('/salvar-servico', {
                    method: 'POST',
                    headers: bcAuthHeaders(),
                    body: new URLSearchParams(fd)
                });
                if (res.status === 401) return bcLogout();
                if (res.redirected || res.ok) {
                    e.target.reset();
                    carregar();
                } else {
                    alert('Erro ao salvar serviço');
                }
            });
        } else {
            document.getElementById('subtitulo').textContent = 'Veja o que oferecemos e faça seu pedido';
        }

        function formatarPreco(v) {
            return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function carregar() {
            const res = await fetch('/listar-servicos', { headers: bcAuthHeaders() });
            if (res.status === 401) return bcLogout();
            const servicos = await res.json();
            const corpo = document.getElementById('lista-servicos');
            if (!servicos.length) {
                corpo.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--texto-claro);">Nenhum produto cadastrado.</td></tr>';
                return;
            }
            corpo.innerHTML = servicos.map(x => `
                <tr>
                    <td><strong>${bcEscape(x.descricao)}</strong></td>
                    <td>R$ ${formatarPreco(x.preco)}</td>
                    <td>${bcEscape(formatarQuandoFeito(x.tempo_estimado))}</td>
                </tr>
            `).join('');
        }
        carregar();
    </script>
</body>
</html>
