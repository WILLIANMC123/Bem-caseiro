<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Serviços</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta</a>
    </nav>

    <header class="banner">
        <img src="logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Gestão de Serviços</h1>
        <p>Catálogo de produtos e serviços</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Novo Serviço / Produto</h2>
            <form action="/salvar-servico" method="POST">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" name="descricao" placeholder="Ex: Pão Francês (dúzia)" required>
                
                <label for="preco">Preço (R$):</label>
                <input type="number" step="0.01" id="preco" name="preco" placeholder="0.00" required>
                
                <label for="tempo_estimado">Tempo de Preparo (min):</label>
                <input type="number" id="tempo_estimado" name="tempo_estimado" placeholder="Ex: 30" required>
                
                <button type="submit">Salvar Serviço</button>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Serviços Disponíveis</h2>
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Preço (R$)</th>
                        <th>Tempo (min)</th>
                    </tr>
                </thead>
                <tbody id="lista-servicos"></tbody>
            </table>
        </div>
    </div>

    <footer class="rodape">
        <p>&copy; 2026 Bem Caseiro - Pães e Delícias</p>
    </footer>

    <script>
        fetch('/listar-servicos')
            .then(res => res.json())
            .then(servicos => {
                const corpo = document.getElementById('lista-servicos');
                servicos.forEach(s => {
                    corpo.innerHTML += `<tr><td><strong>${s.descricao}</strong></td><td>R$ ${s.preco.toFixed(2)}</td><td>${s.tempo_estimado} min</td></tr>`;
                });
            });
    </script>
</body>
</html>
