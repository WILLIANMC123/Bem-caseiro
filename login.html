<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Login</title>
    <style>
        .login-box {
            max-width: 420px;
            margin: 0 auto;
        }
        .msg-erro {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: none;
        }
        .login-hint {
            text-align: center;
            color: var(--texto-claro);
            font-size: 0.95rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="login.html">Consulta</a>
    </nav>

    <header class="banner">
        <img src="logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Acesso à Consulta</h1>
        <p>Área restrita — somente autorizados</p>
    </header>

    <div class="container">
        <div class="card login-box">
            <h2>Entrar</h2>
            <p style="color: var(--texto-claro); margin-top: 0;">Digite usuário e senha para ver os pedidos.</p>

            <div id="erro" class="msg-erro"></div>

            <form id="form-login">
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Usuário" required autocomplete="username">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">

                <button type="submit" id="btn-entrar" style="width: 100%; margin-top: 10px;">Entrar</button>
            </form>
        </div>
    </div>

    <footer class="rodape">
        <p>&copy; 2026 Bem Caseiro - Pães e Delícias</p>
    </footer>

    <script>
        const TOKEN_KEY = 'bem_caseiro_auth_token';

        (async function () {
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) return;
            try {
                const res = await fetch('/verificar-auth', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.autenticado) {
                    window.location.href = 'consulta_agendamentos.html';
                }
            } catch (e) { }
        })();

        document.getElementById('form-login').addEventListener('submit', async function (e) {
            e.preventDefault();
            const erro = document.getElementById('erro');
            const btn = document.getElementById('btn-entrar');
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;

            erro.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                const data = await res.json();

                if (data.success && data.token) {
                    sessionStorage.setItem(TOKEN_KEY, data.token);
                    window.location.href = 'consulta_agendamentos.html';
                    return;
                }
                throw new Error(data.error || 'Usuário ou senha incorretos.');
            } catch (err) {
                erro.textContent = err.message || 'Falha no login. Tente novamente.';
                erro.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
