<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Bem Caseiro - Clientes</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta</a>
    </nav>

    <header class="banner">
        <img src="logo-bem-caseiro.png" alt="Bem Caseiro" style="height: 80px; width: auto; margin-bottom: 15px;">
        <h1>Gestão de Clientes</h1>
        <p>Cadastre e gerencie seus clientes</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Novo Cliente</h2>
            <form action="/salvar-cliente" method="POST">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required>
                
                <label for="cpf">CPF / CNPJ:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                
                <label for="telefone">Telefone / WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 99999-9999" required>
                
                <button type="submit">Salvar Cliente</button>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Clientes Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF/CNPJ</th>
                        <th>Telefone</th>
                    </tr>
                </thead>
                <tbody id="lista-clientes"></tbody>
            </table>
        </div>
    </div>

    <footer class="rodape">
        <p>&copy; 2026 Bem Caseiro - Pães e Delícias</p>
    </footer>

    <script>
        fetch('/listar-clientes')
            .then(res => res.json())
            .then(clientes => {
                const corpo = document.getElementById('lista-clientes');
                clientes.forEach(c => {
                    corpo.innerHTML += `<tr><td><strong>${c.nome}</strong></td><td>${c.cpf}</td><td>${c.telefone}</td></tr>`;
                });
            });
    </script>
</body>
</html>
